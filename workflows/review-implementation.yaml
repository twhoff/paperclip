# yaml-language-server: $schema=../schemas/workflow.schema.json

name: Review Implementation
description: >-
  Review an identified candidate with explicit authority, immutable revision
  evidence and checks proportional to risk. Verdict and delivery are separate.

preflight:
  - prompt: >-
      Load .agents/skills/use-workflow/review-contract.md and execute its entry
      and candidate-record sections. This is the shared review procedure for
      both adapters; do not substitute a private copy. Record advisory,
      bounded-reviewer, independent-reviewer or coordinator mode and authority
      before mutations. Use your own intent-only session for read-only review.
      Never claim the implementation issue merely to inspect it.

  - prompt: >-
      Read required issue context using `holly tracker show <id> --json`.
      Record current status and owner. Missing mandatory context blocks final
      approval, not independent source inspection. An untracked advisory
      review does not require tracker setup.
    condition: The review needs tracked requirements or a tracked handoff.

steps:
  - prompt: >-
      Execute sections 2 and 3 of .agents/skills/use-workflow/review-contract.md:
      persist revision and scope, inspect changed lines and direct contracts,
      widen on evidence of risk, establish required checks and attributable
      evidence. Use holly worktree inspect for read-only committed objects.
      Trigger visual proof for actual UI impact under the UI skill's viewport
      contract. Preserve mandatory project aggregate/release/acceptance gates.
    category: quality

  - prompt: >-
      Execute section 4 of the shared review contract. Save the report and
      review.json, validate against the adjacent review-record.schema.json,
      and choose approve, changes-requested, blocked or escalate. Missing
      required evidence cannot approve. A status of in_review is not approval.
    category: delivery

postflight:
  - prompt: >-
      Execute section 5 of the shared review contract. Bounded reviewers return
      the report and publication request to the orchestrator without tracker
      mutations. Authorised independent chat reviewers retain the project's
      review/landing role. Before an authorised mutation, re-read current owner
      and status and recheck candidate identity. Same-issue fixes stay on the
      issue; create separate work only with coordinator/planning authority.
      Persist every tracked verdict with `holly tracker comment <issue-id>
      --message "<verdict, candidate SHA, evidence, report and next owner/action>"`
      through the authorised actor. For changes-requested on a currently
      in_review issue, that actor uses `holly tracker update <issue-id> --status
      in_progress` even if it was already in_review at entry. Unexpected states
      require reconciliation; approval alone never closes or lands.

  - prompt: >-
      Use the Beads addendum for supported status and owner transitions.
      A durable issue comment is the handoff record. Use holly chat only when
      needed to reach the responsible owner; do not duplicate announcements.
      If distinct work is authorised, use holly tracker create with complete
      context, acceptance criteria and verification, then supported dependency
      metadata. A bounded reviewer only requests this coordinator action.
    condition: An authorised actor needs a Beads handoff or separate follow-up.
